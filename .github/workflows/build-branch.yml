name: Build Branches


on:
  push:
    branches:
      - dev
  workflow_dispatch:


permissions:
  contents: read


jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout ${{ github.ref_name }}
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # generate-version.ps1 derives the DLL version from the nearest v* tag.
    # Take them from upstream rather than pushing tags to the fork, which
    # would trigger the release workflow:
    - name: Fetch upstream version tags
      run: git fetch --no-tags https://github.com/SpectrumQT/XXMI-Libs-Package.git "refs/tags/v*:refs/tags/v*"

    - name: Add MSBuild for VS2022 to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: '[17.0,18.0)'

    - name: Build solution
      run: msbuild StereoVisionHacks.sln -property:Configuration="Zip Release" -property:Platform=x64 -target:rebuild -verbosity:minimal

    - name: Upload DLLs
      uses: actions/upload-artifact@v4
      with:
        name: XXMI-PACKAGE-${{ github.ref_name }}
        path: x64/Zip Release/*.dll
        if-no-files-found: error
