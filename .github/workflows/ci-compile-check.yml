name: PR Compile Check


on:
  workflow_dispatch:


permissions:
  contents: read


jobs:
  build:
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        ref:
          - fixes/stream-output-targets
          - stream-output/document-pipeline

    name: ${{ matrix.ref }}

    steps:
    - name: Checkout ${{ matrix.ref }}
      uses: actions/checkout@v4
      with:
        ref: ${{ matrix.ref }}
        fetch-depth: 0

    # generate-version.ps1 derives the DLL version from the nearest v* tag.
    # Take them from upstream rather than pushing tags to the fork, which
    # would trigger the release workflow:
    - name: Fetch upstream version tags
      run: git fetch --no-tags https://github.com/SpectrumQT/XXMI-Libs-Package.git "refs/tags/v*:refs/tags/v*"

    - name: Add MSBuild for VS2022 to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: '[17.0,18.0)'

    - name: Build solution
      run: msbuild StereoVisionHacks.sln -property:Configuration="Zip Release" -property:Platform=x64 -target:rebuild -verbosity:minimal

    - name: Name the artifact after the ref
      env:
        REF: ${{ matrix.ref }}
      run: |
        $name = "XXMI-PACKAGE-" + ($env:REF -replace '/', '-')
        "artifact_name=$name" >> $env:GITHUB_ENV

    - name: Upload DLLs
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.artifact_name }}
        path: x64/Zip Release/*.dll
        if-no-files-found: error
